function newData(){return {xp:0,voice:true,sessions:[],answers:[],completedDays:{},learned:{},active:null,createdAt:Date.now()};}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.sessions)&&Array.isArray(x.answers))return {...newData(),...x}}catch(e){}return newData()}
let data=load(),view='home',session=null,feedback=null,typed='',selected='',caps=false,parentPin='',parentUnlocked=false,notice='',setupPin='';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){return false}}
function localDate(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function prettyDate(iso){return iso?new Date(iso).toLocaleDateString('cs-CZ'):''}
function taskPool(section){let a=T.filter(t=>t.section===section);if(section==='iy')return a.filter(t=>t.id.startsWith('bl'));if(section==='spell')return a.filter(t=>t.id.startsWith('blsp'));return a;}
function pick(section,num){return shuffle(taskPool(section)).slice(0,num).map(t=>t.id)}
const getTask=id=>T.find(t=>t.id===id);
function todayIds(){const key=localDate(); let seed=key.split('-').reduce((s,n)=>s+Number(n),0);const deterministic=list=>list.slice().sort((a,b)=>hash(a.id+key)-hash(b.id+key));return [['iy',8],['prefix',5],['orth',3],['spell',2],['read',2]].flatMap(([topic,count])=>deterministic(taskPool(topic)).slice(0,count).map(x=>x.id));}
function hash(s){let h=2166136261;for(const c of s){h=Math.imul(h^c.charCodeAt(0),16777619)}return h>>>0}
function grade(score,total){let n=total?100*score/total:0;return n>=90?1:n>=75?2:n>=60?3:n>=40?4:5}
function begin(mode,section){
 if(mode==='daily'&&data.active?.mode==='daily'&&data.active?.day===localDate()){resume();return}
 let ids;
 if(mode==='daily')ids=todayIds();
 else if(mode==='test')ids=section==='mix'?shuffle([...pick('iy',4),...pick('prefix',3),...pick('orth',3),...pick('case',2)]):pick(section,8);
 else ids=pick(section,section==='read'?6:section==='spell'?8:12);
 if(!ids.length)return;
 session={mode,section:section??null,ids,index:0,records:[],day:localDate(),startedAt:Date.now()};
 feedback=null;typed='';selected='';data.active=session;save();view='question';render();voiceQuestion()
}
function resume(){if(!data.active)return;session=data.active;feedback=null;selected='';typed='';if(session.records.length>session.index){session.index=session.records.length;data.active=session;save()}if(session.index>=session.ids.length){endSession();return}view='question';render();voiceQuestion()}
function endSession(){let correct=session.records.filter(x=>x.correct).length;const summary={mode:session.mode,section:session.section,day:session.day,startedAt:session.startedAt,finishedAt:Date.now(),correct,total:session.ids.length,grade:grade(correct,session.ids.length),records:session.records};data.sessions.push(summary);data.answers.push(...session.records);data.xp+=correct*10+(session.ids.length-correct)*4;if(session.mode==='daily')data.completedDays[session.day]=summary.grade;data.active=null;session=null;feedback=null;save();view='summary';render()}
function qcurrent(){return getTask(session.ids[session.index])}
function choose(val){selected=String(val);render()}
function insert(ch){typed+=caps?ch.toLocaleUpperCase('cs-CZ'):ch;render()}
function backspace(){typed=Array.from(typed).slice(0,-1).join('');render()}
function check(){
 const q=qcurrent();if(!q)return;
 const guess=q.kind==='spell'?typed.trim():selected;if(!guess)return;
 const normalized=q.kind==='spell'?guess.toLocaleLowerCase('cs-CZ'):guess;
 const correct=normalized===q.answer;
 const entry={id:q.id,section:q.section,correct,guess,expected:q.answer,at:Date.now()};
 session.records.push(entry);data.active=session;save();
 if(session.mode==='test'){next();return}
 feedback={correct,guess};view='feedback';render();
 speak((correct?'Výborně, Šájo! ':'Nevadí, Šájo. Teď si řekneme proč. ')+q.explanation,true);
}
function next(){feedback=null;selected='';typed='';session.index++;data.active=session;save();if(session.index>=session.ids.length)endSession();else{view='question';render();voiceQuestion()}}

function pinHtml(){return `<section class="panel exercise" style="max-width:440px;text-align:center"><h2>🔒 Pro rodiče</h2><p class="subtitle">${!hasPin()?(setupPin?'Zadej nový kód podruhé pro potvrzení.':'Použij stejný rodičovský kód jako v matematice.'): 'Zadej rodičovský kód.'} Použij číslice na obrazovce – klávesnice tabletu nevyskočí.</p><div class="pin">${'●'.repeat(parentPin.length)||'·······'}</div><div class="pinboard">${['1','2','3','4','5','6','7','8','9','⌫','0','OK'].map(x=>`<button class="key" data-pin="${x}">${x}</button>`).join('')}</div>${notice?`<p class="badtext">${esc(notice)}</p>`:''}<div style="margin-top:16px"><button class="btn ghost" data-go="home">Zpět</button></div></section>`}
function advice(st){const n=st.filter(x=>x.n>=5).sort((a,b)=>a.percent-b.percent);if(!st.some(x=>x.n))return 'Nejdřív Šája dokončí několik krátkých cvičení. Zatím nemáme dost dat pro doporučení.';if(!n.length)return 'Zatím máme málo odpovědí v jednotlivých oblastech. Doporučuji 2–3 krátké lekce, potom se ukáže, co potřebuje opakovat.';const x=n[0];return `Nejdřív bych procvičoval oblast „${x.t.name}“ (${x.percent} % z ${x.n} odpovědí). U chyb se zaměřte na vysvětlení pravidla a vraťte se k němu i další den.`}
function parentsHtml(){const st=statsByTopic(),recent=[...data.answers].filter(x=>!x.correct).reverse().slice(0,12);return `<section class="panel"><h2>👨‍👩‍👧 Rodičovská kontrola</h2><p class="subtitle">Přehled je jen z tohoto tabletu. Úspěšnost není měření inteligence ani předpověď školních známek.</p><h3>Doporučení na další učení</h3><div class="hint">${esc(advice(st))}</div><h3 style="margin-top:22px">Co Šáje jde a co potřebuje trénovat</h3>${st.map(x=>`<div class="sectionrow"><div><strong>${x.t.icon} ${x.t.name}</strong><small style="display:block;color:var(--muted)">${x.n} odpovědí · správně ${x.c}</small></div><strong class="${x.percent===null?'':x.percent>=80?'ok':x.percent<60?'badtext':''}">${x.percent===null?'Málo dat':x.percent+' %'}</strong></div>`).join('')}<h3 style="margin-top:24px">Poslední chyby</h3>${recent.length?recent.map(r=>{const q=getTask(r.id);return `<div class="sectionrow"><div><strong>${esc(TOPICS[r.section].name)} – ${esc(q?.kind==='gap'?q.word:q?.kind==='case'||q?.kind==='pos'?q.word:q?.context||'Příklad')}</strong><small style="display:block;color:var(--muted)">Odpověděla: ${esc(r.guess)} · správně: ${esc(r.expected)}</small></div></div>`}).join(''):'<p class="note">Zatím žádné chyby.</p>'}<h3 style="margin-top:23px">Historie známek</h3>${data.sessions.length?[...data.sessions].reverse().slice(0,15).map(s=>`<div class="sectionrow"><span>${s.mode==='daily'?'Denní úkol':s.mode==='test'?'Testík – '+(TOPICS[s.section]?.name||'mix'):TOPICS[s.section]?.name} · ${prettyDate(s.finishedAt)}</span><strong>${s.grade} (${s.correct}/${s.total})</strong></div>`).join(''):'<p class="note">Zatím žádná známka.</p>'}<div class="actions" style="margin-top:24px"><button class="btn ghost" id="backup">⬇️ Uložit zálohu</button><button class="btn ghost" id="restore">⬆️ Načíst zálohu</button><button class="btn red" id="reset">🗑️ Vymazat výsledky</button><button class="btn ghost" id="lock">🔒 Zamknout</button></div><p class="note">Rodičovský kód si nastavuješ na tabletu. Je to jen základní ochrana před náhodným otevřením; výsledky nejsou šifrované.</p></section>`}
function render(){document.getElementById('saja-app').classList.toggle('focus-mode',(!!session&&(view==='question'||view==='feedback'))||view==='learn');header();let html=view==='home'?homeHtml():view==='learnList'?learnListHtml():view==='learn'?lessonHtml():view==='learnDone'?lessonDoneHtml():view==='tests'?testsHtml():view==='practice'?practiceHtml():view==='progress'?progressHtml():view==='question'&&session?questionHtml():view==='feedback'&&session&&feedback?feedbackHtml():view==='summary'?summaryHtml():view==='pin'?pinHtml():view==='parents'&&parentUnlocked?parentsHtml():homeHtml();$('#main').innerHTML=html;wire()}
function go(v){if(v==='parents'&&!parentUnlocked)v='pin';view=v;notice='';render()}
function wire(){document.querySelectorAll('[data-lesson]').forEach(x=>x.onclick=()=>startLesson(x.dataset.lesson));document.querySelectorAll('[data-test]').forEach(x=>x.onclick=()=>begin('test',x.dataset.test));document.querySelectorAll('[data-explain]').forEach(x=>x.onclick=()=>{const q=getTask(x.dataset.explain);if(q)speak(q.explanation,true)});document.querySelectorAll('[data-learn-choice]').forEach(x=>x.onclick=()=>teacherChoose(Number(x.dataset.learnChoice)));let teacherButton;if(teacherButton=$('#teacher-speak'))teacherButton.onclick=teacherSpeakIntro;if(teacherButton=$('#teacher-try'))teacherButton.onclick=teacherTry;if(teacherButton=$('#teacher-hint'))teacherButton.onclick=teacherHint;if(teacherButton=$('#teacher-repeat-question'))teacherButton.onclick=()=>speak(lesson.question+' Vyber správnou odpověď.',true);if(teacherButton=$('#teacher-repeat-result'))teacherButton.onclick=()=>speak(lesson.why,true);if(teacherButton=$('#teacher-next'))teacherButton.onclick=teacherNext;if(teacherButton=$('#teacher-enable-voice'))teacherButton.onclick=()=>{data.voice=true;save();render();teacherSpeakIntro()};document.querySelectorAll('[data-start]').forEach(x=>x.onclick=()=>begin(x.dataset.start));document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>go(x.dataset.go));document.querySelectorAll('[data-topic]').forEach(x=>x.onclick=()=>begin('practice',x.dataset.topic));document.querySelectorAll('[data-option]').forEach(x=>x.onclick=()=>choose(x.dataset.option));document.querySelectorAll('[data-char]').forEach(x=>x.onclick=()=>insert(x.dataset.char));document.querySelectorAll('[data-pin]').forEach(x=>x.onclick=()=>pinPress(x.dataset.pin));document.querySelectorAll('[data-action]').forEach(x=>x.onclick=()=>{if(x.dataset.action==='caps'){caps=!caps;render()}else backspace()});let el;if(el=$('#resume'))el.onclick=resume;if(el=$('#read-aloud'))el.onclick=voiceQuestion;if(el=$('#pause'))el.onclick=pause;if(el=$('#check'))el.onclick=check;if(el=$('#next'))el.onclick=next;if(el=$('#backup'))el.onclick=backup;if(el=$('#restore'))el.onclick=()=>$('#restore-file').click();if(el=$('#reset'))el.onclick=()=>{if(confirm('Opravdu chceš vymazat úplně všechny výsledky Šáji v češtině?'))if(confirm('Potvrď znovu trvalé vymazání.')){data=newData();save();render()}};if(el=$('#lock'))el.onclick=()=>{parentUnlocked=false;parentPin='';go('home')}}
function pinPress(c){
 notice='';
 if(c==='⌫'){parentPin=parentPin.slice(0,-1)}
 else if(c==='OK'){
  if(!hasPin()){
   if(!setupPin){
    if(parentPin.length<4||parentPin.length>8){notice='Vyber kód o délce 4 až 8 číslic.';parentPin=''}
    else{setupPin=parentPin;parentPin=''}
   }else if(parentPin===setupPin){
    try{localStorage.setItem(PIN_STORAGE,pinHash(parentPin))}catch(e){notice='Kód nelze uložit, zkontroluj nastavení úložiště.';render();return}
    setupPin='';parentPin='';parentUnlocked=true;go('parents');return
   }else{setupPin='';parentPin='';notice='Kódy nesouhlasily. Zkus nastavení znovu.'}
  }else if(pinHash(parentPin)===COMMON_PARENT_HASH||pinHash(parentPin)===localStorage.getItem(PIN_STORAGE)){
   parentUnlocked=true;parentPin='';go('parents');return
  }else{parentPin='';notice='Kód nesouhlasí. Zkus to znovu.'}
 }else if(parentPin.length<8)parentPin+=c;
 render()
}
function backup(){const blob=new Blob([JSON.stringify({app:'saja-cestina-v1',data},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Saja_Cestina_zaloha_${localDate()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
$('#restore-file').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const raw=JSON.parse(await file.text());if(raw.app!=='saja-cestina-v1'||!Array.isArray(raw.data?.sessions)||!Array.isArray(raw.data?.answers))throw Error('Neplatná záloha');if(confirm('Načíst tuto zálohu? Současné výsledky češtiny se nahradí.')){data={...newData(),...raw.data};save();render();alert('Záloha načtena.')}}catch(err){alert('Zálohu se nepodařilo načíst: '+err.message)}e.target.value=''};
$('#tabs').onclick=e=>{const b=e.target.closest('[data-view]');if(b){if(session&&view==='question'){data.active=session;save();session=null}go(b.dataset.view)}};
$('#parent-button').onclick=()=>go('parents');$('#voice-toggle').onclick=()=>{data.voice=!data.voice;save();if(!data.voice&&'speechSynthesis'in window)speechSynthesis.cancel();render()};
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
</script></body></html>
